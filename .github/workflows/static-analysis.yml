name: Static Analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  cppcheck:
    runs-on: ubuntu-latest
    env:
      CPPCHECK_VERSION: "2.20.0"
    steps:
    - uses: actions/checkout@v4

    - name: Cache cppcheck build
      id: cache-cppcheck
      uses: actions/cache@v4
      with:
        path: /opt/cppcheck
        key: cppcheck-${{ env.CPPCHECK_VERSION }}-ubuntu-latest

    - name: Build cppcheck from source
      if: steps.cache-cppcheck.outputs.cache-hit != 'true'
      run: |
        sudo apt-get update && sudo apt-get install -y build-essential cmake
        git clone --depth 1 --branch "$CPPCHECK_VERSION" https://github.com/danmar/cppcheck.git /tmp/cppcheck
        cmake -S /tmp/cppcheck -B /tmp/cppcheck/build \
          -DUSE_MATCHCOMPILER=ON \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=/opt/cppcheck
        cmake --build /tmp/cppcheck/build -j"$(nproc)"
        cmake --install /tmp/cppcheck/build

    - name: Install cppcheck
      run: |
        echo "/opt/cppcheck/bin" >> "$GITHUB_PATH"
        /opt/cppcheck/bin/cppcheck --version

    - name: Run cppcheck
      run: make lint

  dashboard-lint:
    runs-on: ubuntu-latest
    env:
      DASHBOARD_LINTER_VERSION: "0.1.0"
      DASHBOARD_LINTER_SHA256: "a51970b1b7db199a1e557fcf8442e2c65dd8341df05d06cb7bd699206c7c5bbd"
    steps:
    - uses: actions/checkout@v4

    - name: Install dashboard-linter
      run: |
        url="https://github.com/grafana/dashboard-linter/releases/download/v${DASHBOARD_LINTER_VERSION}/dashboard-linter_${DASHBOARD_LINTER_VERSION}_linux_amd64.tar.gz"
        curl -sSfL "$url" -o dashboard-linter.tar.gz
        echo "${DASHBOARD_LINTER_SHA256}  dashboard-linter.tar.gz" | sha256sum -c -
        tar -xzf dashboard-linter.tar.gz dashboard-linter
        sudo install -m 0755 dashboard-linter /usr/local/bin/dashboard-linter
        rm -f dashboard-linter.tar.gz dashboard-linter

    - name: Lint Grafana dashboards
      run: |
        for f in dashboards/*.json; do
          dashboard-linter lint "$f" --strict
        done

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
    - uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: c-cpp

    - name: Build
      run: |
        sudo apt-get update && sudo apt-get install -y build-essential libssl-dev zlib1g-dev
        make -j$(nproc)

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
