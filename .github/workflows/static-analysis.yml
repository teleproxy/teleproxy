name: Static Analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  cppcheck:
    runs-on: ubuntu-latest
    env:
      CPPCHECK_VERSION: "2.20.0"
    steps:
    - uses: actions/checkout@v4

    - name: Cache cppcheck build
      id: cache-cppcheck
      uses: actions/cache@v4
      with:
        path: /opt/cppcheck
        key: cppcheck-${{ env.CPPCHECK_VERSION }}-ubuntu-latest

    - name: Build cppcheck from source
      if: steps.cache-cppcheck.outputs.cache-hit != 'true'
      run: |
        sudo apt-get update && sudo apt-get install -y build-essential cmake
        git clone --depth 1 --branch "$CPPCHECK_VERSION" https://github.com/danmar/cppcheck.git /tmp/cppcheck
        cmake -S /tmp/cppcheck -B /tmp/cppcheck/build \
          -DUSE_MATCHCOMPILER=ON \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=/opt/cppcheck
        cmake --build /tmp/cppcheck/build -j"$(nproc)"
        cmake --install /tmp/cppcheck/build

    - name: Install cppcheck
      run: |
        echo "/opt/cppcheck/bin" >> "$GITHUB_PATH"
        /opt/cppcheck/bin/cppcheck --version

    - name: Run cppcheck
      run: make lint

  dashboard-lint:
    runs-on: ubuntu-latest
    env:
      DASHBOARD_LINTER_VERSION: "0.1.0"
      DASHBOARD_LINTER_SHA256: "a51970b1b7db199a1e557fcf8442e2c65dd8341df05d06cb7bd699206c7c5bbd"
    steps:
    - uses: actions/checkout@v4

    - name: Install dashboard-linter
      run: |
        url="https://github.com/grafana/dashboard-linter/releases/download/v${DASHBOARD_LINTER_VERSION}/dashboard-linter_${DASHBOARD_LINTER_VERSION}_linux_amd64.tar.gz"
        curl -sSfL "$url" -o dashboard-linter.tar.gz
        echo "${DASHBOARD_LINTER_SHA256}  dashboard-linter.tar.gz" | sha256sum -c -
        tar -xzf dashboard-linter.tar.gz dashboard-linter
        sudo install -m 0755 dashboard-linter /usr/local/bin/dashboard-linter
        rm -f dashboard-linter.tar.gz dashboard-linter

    - name: Lint Grafana dashboards
      run: |
        for f in dashboards/*.json; do
          dashboard-linter lint "$f" --strict
        done

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
    - uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: c-cpp

    - name: Build
      run: |
        sudo apt-get update && sudo apt-get install -y build-essential libssl-dev zlib1g-dev
        make -j$(nproc)

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

  dead-symbols:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install build deps
      run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev zlib1g-dev

    - name: Build with --gc-sections probe
      run: |
        make clean
        make -j$(nproc) \
          EXTRA_CFLAGS="-ffunction-sections -fdata-sections" \
          EXTRA_LDFLAGS="-Wl,--gc-sections -Wl,--print-gc-sections" \
          2>&1 | tee build.log

    - name: Flag dead source-level symbols
      run: |
        set -e
        # ld emits one line per collected section:
        #   ld: removing unused section '.text.<sym>' in file '...(<obj>.o)'
        # We want every .text.* removal; the path/archive form doesn't matter
        # because only our own src/ objects are compiled with -ffunction-sections
        # (system libs are linked as shared libs and don't appear here).
        sed -nE \
          "s|.*removing unused section '\.text\.([^']+)'.*[/(]([A-Za-z0-9_-]+)\.o['\)].*|\1\t\2|p" \
          build.log | sort -u > dead.tsv
        echo "Linker collected $(wc -l < dead.tsv) .text section(s):"
        cat dead.tsv || true

        bad=0
        while IFS=$'\t' read -r sym obj; do
          [ -n "$sym" ] || continue
          # Look for source-level references. Filter out:
          #   - the definition line (open-brace, no semicolon)
          #   - pure comment lines
          #   - weak-attribute declarations (legacy KittenDB stubs)
          uses=$(git grep -nw "$sym" -- '*.c' '*.h' 2>/dev/null \
            | grep -vE "^[^:]+:[0-9]+:[[:space:]]*[a-zA-Z_].*${sym}[[:space:]]*\([^;]*$" \
            | grep -vE "^[^:]+:[0-9]+:[[:space:]]*//" \
            | grep -vE '__attribute__.*weak' \
            | grep -c . || true)
          if [ "${uses:-0}" -eq 0 ]; then
            echo "::error::Dead symbol '${sym}' in ${obj}.o has no source-level callers; remove the definition"
            bad=$((bad+1))
          else
            echo "ok: ${sym} (${obj}.o): ${uses} source reference(s), compiler-inlined but alive in source"
          fi
        done < dead.tsv

        if [ "$bad" -gt 0 ]; then
          echo "::error::${bad} dead symbol(s) detected"
          exit 1
        fi
